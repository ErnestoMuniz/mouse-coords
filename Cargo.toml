[package]
name = "mouse-coords"
version = "0.1.0"
edition = "2021"
description = "Get the exact mouse coordinates (KDE Wayland via KWin, X11, Windows, macOS)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ErnestoMuniz/mouse-coords"
keywords = ["mouse", "cursor", "position", "wayland", "kwin"]
categories = ["os"]
rust-version = "1.75"

[lib]
name = "mouse_coords"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
